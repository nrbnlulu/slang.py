[project]
name = "slang-example"
version = "0.1.0"
description = "Example usage of the Slang internationalization library"
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "ruff>=0.6.7",
    "slang",
]

[tool.uv.sources]
slang = { workspace = true }

[tool.slang]
output_dir = "src/app/__tr__"
translations_dir = "i18n"
main_language = "en"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]
