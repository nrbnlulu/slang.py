[project]
name = "slang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "<4.0, >=3.12"
dependencies = ["minijinja>=2.2.0", "result", "pyyaml>=6.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slang"]


[tool.pyright]
include = ["slang", "tests"]
typeCheckingMode = "standard"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
    "ruff>=0.6.7",
    "syrupy>=4.7.1",
    "tomli-w>=1.0.0",
]

[tool.uv.sources]
result = { git = "https://github.com/nrbnlulu/result.git" }

[tool.uv.workspace]
members = ["example"]
