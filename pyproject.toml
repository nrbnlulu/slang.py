[project]
name = "slang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "<4.0, >=3.12"
dependencies = [
    "minijinja>=2.2.0",
    "result",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slang"]

[project.scripts]
slang = "slang.cli:app"


[tool.pyright]
include = ["slang", "tests"]
typeCheckingMode = "standard"

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.404",
    "pytest>=8.3.3",
    "ruff>=0.6.7",
    "syrupy>=4.7.1",
    "tomli-w>=1.0.0",
]

[tool.uv.sources]
result = { git = "https://github.com/nrbnlulu/result.git" }

[tool.uv.workspace]
members = ["example"]



[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["input", "filter", "id"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
    "A005",
    "TID252",
    "E501",
    "S101",
    "S102",
    "S104",
    "S324",
    "EXE002",
    "D100",
    "D102",
    "D203",
    "D206",
    "D103",
    "D104",
    "D105",
    "D106",
    "D101",
    "D107",
    "D212",
    "D211",
    "PGH003",
    "PGH004",
    "N811",
    "N804",
    "N818",
    "N806",
    "N815",
    "ARG001",
    "ARG002",
    "DTZ003",
    "DTZ005",
    "RSE102",
